<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse Napio handmade lip glosses, custom resin keychains, hair accessories, and gifts.">
  <meta name="author" content="Napio Mercy Elizabeth">
  <title>Shop Collection | Napio Beauty &amp; Lifestyle</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta property="og:title" content="Shop Collection | Napio Beauty &amp; Lifestyle">
  <meta property="og:description" content="Explore 18 handmade beauty and resin items with category filtering, saved favorites, and quick view details.">
  <meta property="og:image" content="https://napiomercyelizabeth.github.io/wdd231/project/images/social-preview.svg">
  <meta property="og:url" content="https://napiomercyelizabeth.github.io/wdd231/project/catalog.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/larger.css">
  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/catalog.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Napio home">NAPIO<span>Beauty &amp; Lifestyle</span></a>
    <button class="menu-button" id="menu-button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"></button>
    <nav aria-label="Main navigation">
      <ul id="primary-nav" class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="catalog.html" aria-current="page">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section class="page-intro">
      <p class="eyebrow">Catalog</p>
      <h1>Handmade &amp; Curated Picks</h1>
      <p>Filter by category, save favorites to your browser, or select any item to open full details.</p>
    </section>

    <section class="catalog-controls" aria-label="Filter and saved count">
      <div class="filter-group" id="category-filters" role="group" aria-label="Filter products by category">
        <button type="button" class="filter-btn is-selected" data-category="all">All</button>
        <button type="button" class="filter-btn" data-category="Lip Care">Lip Care</button>
        <button type="button" class="filter-btn" data-category="Resin">Resin</button>
        <button type="button" class="filter-btn" data-category="Hair &amp; Gift">Hair &amp; Gift</button>
      </div>
      <p id="saved-summary" class="saved-summary" aria-live="polite">Saved favorites: 0</p>
    </section>

    <section aria-labelledby="catalog-heading">
      <h2 id="catalog-heading" class="visually-hidden">Product List</h2>
      <div id="product-list" class="product-grid" aria-live="polite"></div>
      <p id="catalog-error" class="error-message" role="alert"></p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Napio Mercy Elizabeth</p>
    <p id="last-modified"></p>
    <nav class="footer-links" aria-label="Footer resources">
      <a href="attributions.html">Attributions</a>
      <a href="YOUR_VIDEO_URL_HERE" target="_blank" rel="noopener noreferrer">Project Video</a>
    </nav>
  </footer>

  <dialog id="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Close product details">&times;</button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
