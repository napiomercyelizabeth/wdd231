<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Napio handmade lip glosses, resin accessories, and personal care items.">
  <meta name="author" content="Napio Mercy Elizabeth">
  <title>Shop | Napio Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/site.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Napio home">NAPIO<span>Beauty &amp; Lifestyle</span></a>
    <button class="menu-button" id="menu-button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"></button>
    <nav aria-label="Main navigation">
      <ul id="primary-nav" class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="catalog.html" aria-current="page">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section class="page-heading">
      <p class="eyebrow">The collection</p>
      <h1>Find your new favorite.</h1>
      <div class="filter-bar" aria-label="Filter products">
        <button class="filter active" type="button" data-category="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-category="Lip Gloss" aria-pressed="false">Lip Gloss</button>
        <button class="filter" type="button" data-category="Resin" aria-pressed="false">Resin</button>
        <button class="filter" type="button" data-category="Personal Care" aria-pressed="false">Personal Care</button>
      </div>
    </section>

    <section aria-label="Product catalog">
      <div id="catalog-products" class="product-grid catalog-grid" aria-live="polite"></div>
      <p id="product-error" class="error-message" role="alert"></p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Napio Mercy Elizabeth</p>
    <p id="last-modified"></p>
  </footer>
  <dialog id="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Close product details">&times;</button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
